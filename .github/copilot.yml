# GitHub Copilot Workspace Configuration

# Enable Copilot features
copilot:
  enabled: true
  
# Copilot Chat context
chat:
  context_files:
    - ".github/copilot-instructions.md"
    - "package.json"
    - "README.md"
    - "tools.json"
  
  # Include relevant files for context
  include_patterns:
    - "src/**/*.js"
    - "tests/**/*.js"
    - "*.json"
    - "*.md"
  
  # Exclude sensitive or generated files
  exclude_patterns:
    - "constants.js"
    - "node_modules/**"
    - ".env"
    - "*.log"

# Skills configuration
skills:
  test:
    command: "npm run test:run"
    description: "Run the complete test suite"
    
  run:
    command: "echo 'quit' | node index.js"
    description: "Test run the Mukt CLI application"
    
  commit:
    description: "Run tests, verify app, and commit changes"
    script: ".github/copilot/run-and-commit.md"
